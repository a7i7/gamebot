services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gamebot
      POSTGRES_PASSWORD: gamebot
      POSTGRES_DB: gamebot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamebot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../backend/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://gamebot:gamebot@postgres:5432/gamebot
      - SECRET_KEY=change-me-in-production
      - ACCESS_TOKEN_EXPIRE_DAYS=7
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
